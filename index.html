<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kamus</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e5e5e5;
}

.wrapper{
width:95%;
max-width:420px;
margin:auto;
margin-top:10px;
}

.tabs{
display:flex;
}

.tab{
flex:1;
padding:10px;
text-align:center;
font-weight:bold;
border:3px solid black;
background:white;
cursor:pointer;
}

.tab.active{
background:#ddd;
}

.box{
border:5px solid black;
padding:10px;
background:#eee;
}

.letters{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.letter{
background:yellow;
border:3px solid black;
font-weight:bold;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
height:50px;
cursor:pointer;
}

.result{
margin-top:10px;
border:4px solid black;
background:white;
height:200px;
overflow:auto;
padding:8px;
}

.word{
border-bottom:1px solid #ddd;
padding:4px;
font-size:14px;
}

textarea{
width:100%;
height:150px;
}

button{
margin-top:10px;
padding:10px;
width:100%;
font-size:14px;
}

.section{
display:none;
}

.section.active{
display:block;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="tabs">

<div class="tab active" onclick="openTab('kamus',this)">KAMUS</div>
<div class="tab" onclick="openTab('input',this)">INPUT</div>

</div>

<div class="box">

<!-- ================= KAMUS ================= -->

<div id="kamus" class="section active">

<div class="letters" id="letters"></div>

<div class="result" id="result">
Klik huruf
</div>

</div>

<!-- ================= INPUT ================= -->

<div id="input" class="section">

<textarea id="bulk"></textarea>

<button onclick="kirim()">INPUT KE SPREADSHEET</button>

<div id="status"></div>

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbymqnOlimdVeRSWh4olwHZhUkXM3JsCuVzpFAqk9MajDbmlq9zZU103AOG-HaIehdk-mg/exec";

const abjad="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const letters=document.getElementById("letters");

abjad.forEach(l=>{

let d=document.createElement("div");

d.className="letter";

d.innerText=l;

d.onclick=()=>loadLetter(l);

letters.appendChild(d);

});



function openTab(id,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

el.classList.add("active");

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));

document.getElementById(id).classList.add("active");

}



async function loadLetter(letter){

document.getElementById("result").innerHTML="Loading...";

const res=await fetch(API+"?action=getLetter&letter="+letter);

const data=await res.json();

if(!data.status){
document.getElementById("result").innerHTML="Tidak ada data";
return;
}

let html="";

data.words.forEach(w=>{
html+=`<div class="word">${w}</div>`;
});

document.getElementById("result").innerHTML=html;

}



async function kirim(){

const text=document.getElementById("bulk").value;

if(text.length<2){
alert("Masukkan kata dulu");
return;
}

document.getElementById("status").innerText="Mengirim...";

const res=await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"inputMassal",
text:text
})
});

const data=await res.json();

document.getElementById("status").innerText="Berhasil input "+data.inserted+" kata";

document.getElementById("bulk").value="";

}

</script>

</body>
</html>
