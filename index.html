<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamus Engine</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef2f7;
    display:flex;
    justify-content:center;
}

.wrapper{
    width:95%;
    max-width:420px;
    margin:15px 0;
    background:white;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    padding:15px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.tab{
    flex:1;
    padding:8px;
    text-align:center;
    border-radius:10px;
    background:#f1f4f8;
    cursor:pointer;
    font-size:13px;
}

.tab.active{
    background:#4a90e2;
    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

textarea{
    width:100%;
    height:100px;
    border-radius:10px;
    border:1px solid #dfe6ee;
    padding:8px;
    font-size:13px;
    resize:none;
}

input{
    flex:1;
    padding:8px;
    border-radius:10px;
    border:1px solid #dfe6ee;
    font-size:13px;
}

.input-group{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.results{
    background:#f8fafc;
    border-radius:12px;
    padding:8px;
    min-height:80px;
    max-height:120px;
    overflow-y:auto;
    font-size:13px;
}

.word{
    padding:3px 0;
    border-bottom:1px solid #ecf0f3;
}

.word:last-child{
    border-bottom:none;
}

.info{
    font-size:11px;
    color:#888;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="tabs">
    <div class="tab active" onclick="switchTab('kamus')">Kamus</div>
    <div class="tab" onclick="switchTab('input')">Input Massal</div>
</div>

<!-- ================= KAMUS ================= -->
<div id="kamus" class="section active">
    <div class="input-group">
        <input type="text" id="prefix" maxlength="3" placeholder="Awalan 1-3 huruf">
        <input type="text" id="suffix" maxlength="2" placeholder="Akhiran 0-2">
    </div>
    <div class="results" id="results">
        <div class="info">Ketik awalan untuk mulai...</div>
    </div>
</div>

<!-- ================= INPUT MASSAL ================= -->
<div id="input" class="section">
    <textarea id="bulkText" placeholder="Tempel banyak kata di sini..."></textarea>
    <div class="info">Otomatis dipilah ke A-Z</div>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxZ5GkXfGJSSdB5AmhAmBVYx6kubkEnMQX4822JdxjlSCNZheI3TxbmPlwGTlgyNLxiAA/exec";

let pool = [];
let rotateTimer = null;

/* ================= TAB SWITCH ================= */

function switchTab(id){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById(id).classList.add("active");
}

/* ================= SEARCH ================= */

async function search(){
    const prefix = document.getElementById("prefix").value.trim().toLowerCase();
    const suffix = document.getElementById("suffix").value.trim().toLowerCase();

    if(prefix.length < 1){
        document.getElementById("results").innerHTML =
            "<div class='info'>Minimal 1 huruf</div>";
        return;
    }

    const res = await fetch(
        `${API_URL}?action=search&prefix=${prefix}&suffix=${suffix}`
    );
    const data = await res.json();

    if(data.status){
        pool = data.words || [];
        renderRandom();
        startRotate();
    }
}

/* ================= RENDER ================= */

function renderRandom(){
    if(pool.length === 0){
        document.getElementById("results").innerHTML =
            "<div class='info'>Tidak ada hasil</div>";
        return;
    }

    let shuffled = [...pool].sort(()=>0.5-Math.random());
    let show = shuffled.slice(0,10);

    document.getElementById("results").innerHTML =
        show.map(w=>`<div class="word">${w}</div>`).join("");
}

/* ================= AUTO ROTATE ================= */

function startRotate(){
    if(rotateTimer) clearInterval(rotateTimer);
    rotateTimer = setInterval(()=>{
        renderRandom();
    },60000);
}

/* ================= INPUT MASSAL ================= */

document.getElementById("bulkText")
.addEventListener("input", debounce(async function(){
    const text = this.value;
    if(text.length < 3) return;

    await fetch(API_URL,{
        method:"POST",
        body: JSON.stringify({
            action:"inputMassal",
            text:text
        })
    });

},1000));

/* ================= EVENT ================= */

document.getElementById("prefix")
.addEventListener("input", debounce(search,400));

document.getElementById("suffix")
.addEventListener("input", debounce(search,400));

function debounce(fn,delay){
    let t;
    return function(){
        clearTimeout(t);
        t=setTimeout(fn,delay);
    }
}

</script>

</body>
</html>
